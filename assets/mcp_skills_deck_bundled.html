<style>
  :root{ --bg:#0d1117; --fg:#c9d1d9; --muted:#8b949e; --line:#21262d; --accent:#2dd4bf; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .stage{height:100vh;display:flex;flex-direction:column}
  .slide-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;min-height:0}
  .slide{display:none;width:100%;height:100%;align-items:center;justify-content:center}
  .slide.on{display:flex}
  .slide svg{max-width:100%;max-height:100%;width:auto;height:auto;
    border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.5)}

    padding:12px 18px;border-top:1px solid var(--line);background:#0a0e13;flex-wrap:wrap}
  button{background:#161b22;color:var(--fg);border:1px solid #30363d;border-radius:8px;
    padding:8px 16px;font-size:14px;cursor:pointer}
  button:hover{border-color:var(--accent);color:#fff}
  .dots{display:flex;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:#30363d;cursor:pointer}
  .dot.on{background:var(--accent)}
  .label{font-size:13px;color:var(--muted);min-width:230px;text-align:center}
  .hint{font-size:11px;color:#6e7681}
</style>
</head>

  <title id="t2">Context Protocol Elements</title>
  <desc id="d2">The MCP server primitives (tools, resources, prompts, capabilities, sampling, roots, elicitation) on the left, and the assembled context window the LLM actually sees on the right (system prompt, agent memory, skills, tools, codebase/resources, user conversation).</desc>

<script>
  const titles=[
    "1 · Full MCP Architecture",
    "2 · Context Protocol Elements (CPE)",
    "3 · MCP vs Skills",
    "4 · Structure of a Skill"
  ];
  const slides=[...document.querySelectorAll('.slide')];
  let i=0;
  const label=document.getElementById('label'), dots=document.getElementById('dots');
  titles.forEach((t,n)=>{const d=document.createElement('div');d.className='dot';
    d.title=t;d.onclick=()=>go(n);dots.appendChild(d);});
  function go(n){i=(n+slides.length)%slides.length;
    slides.forEach((s,k)=>s.classList.toggle('on',k===i));
    label.textContent=titles[i];
    [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));}
  document.getElementById('prev').onclick=()=>go(i-1);
  document.getElementById('next').onclick=()=>go(i+1);
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight')go(i+1); if(e.key==='ArrowLeft')go(i-1);});
  go(0);
</script>
